# NMHS-HMIS-V1.0 — Railway service "hmis-api" (Django + Gunicorn).
#
# Service Settings:
#   Root Directory = /backend/hmis
#   Config File Path = /railway/api/railway.toml
#
# Railway variables/secrets are configured in the dashboard.
# See docs/RAILWAY.md.

[build]
builder = "RAILPACK"

# Railpack detects Python and installs requirements.txt.
# Only run Django's static-file collection here.
buildCommand = "python manage.py collectstatic --noinput"

watchPatterns = ["/backend/hmis/**"]

[deploy]
# Run migrations once before the new release receives traffic.
preDeployCommand = ["python manage.py migrate --noinput"]

# Railway provides PORT. Gunicorn binds to it through the Railway
# environment/configuration, and WEB_CONCURRENCY controls workers.
startCommand = "gunicorn hmis.wsgi:application --timeout 60 --forwarded-allow-ips=\"*\" --error-logfile -"

healthcheckPath = "/healthz/"

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10