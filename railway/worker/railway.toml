# NMHS-HMIS-V1.0 — Railway service "hmis-celery-worker".
#
# Settings: Root Directory = /backend/hmis,
# Config File Path = /railway/worker/railway.toml. Give it NO public domain:
# without one the settings treat it as a process that serves no HTTP.

[build]
builder = "RAILPACK"
watchPatterns = ["/backend/hmis/**"]

[deploy]
startCommand = "celery -A hmis worker -l info --concurrency 2"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
