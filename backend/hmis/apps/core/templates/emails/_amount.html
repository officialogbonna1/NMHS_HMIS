{% comment %}
The figure, as the one thing a finance notification is read for. Shared by the
billing and payment events so the money is presented identically in both.
{% endcomment %}
<tr>
  <td style="padding:18px 28px 0 28px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;">
      <tr>
        <td style="padding:16px 18px;">
          <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#64748b;">{{ amount_label }}</div>
          <div style="font-size:26px;font-weight:bold;color:#0f172a;padding-top:2px;">{{ amount }}</div>
        </td>
      </tr>
    </table>
  </td>
</tr>
